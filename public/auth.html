<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Mesh - Authentication</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0f12 0%, #1a1a2e 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .auth-container {
      background: rgba(26, 26, 31, 0.95);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-header h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #00d1b2, #00bfa5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-header p {
      color: #aaa;
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: #00d1b2;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 10px rgba(0, 209, 178, 0.3);
    }

    .form-error {
      color: #ff6b6b;
      font-size: 0.85rem;
      margin-top: 5px;
      display: none;
    }

    .form-error.show {
      display: block;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 15px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00d1b2, #00bfa5);
      color: #000;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 209, 178, 0.4);
    }

    .btn-secondary {
      background: rgba(0, 209, 178, 0.1);
      color: #00d1b2;
      border: 1px solid #00d1b2;
    }

    .btn-secondary:hover {
      background: rgba(0, 209, 178, 0.2);
    }

    .auth-toggle {
      text-align: center;
      color: #aaa;
      font-size: 0.9rem;
    }

    .auth-toggle a {
      color: #00d1b2;
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
    }

    .auth-toggle a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .success-message {
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      font-size: 0.9rem;
    }

    .success-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>🤖 Bot Mesh</h1>
      <p>AI as a Service Platform</p>
    </div>

    <!-- Login Form -->
    <div id="loginForm" class="auth-form">
      <div class="success-message" id="loginSuccess"></div>
      
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
        <div class="form-error" id="loginEmailError"></div>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required>
        <div class="form-error" id="loginPasswordError"></div>
      </div>

      <button class="btn btn-primary" onclick="handleLogin()">Sign In</button>

      <div class="auth-toggle">
        Don't have an account? <a onclick="toggleForm()">Sign Up</a>
      </div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="auth-form hidden">
      <div class="success-message" id="registerSuccess"></div>
      
      <div class="form-group">
        <label for="registerUsername">Username</label>
        <input type="text" id="registerUsername" placeholder="Choose a username" required>
        <div class="form-error" id="registerUsernameError"></div>
      </div>

      <div class="form-group">
        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" placeholder="you@example.com" required>
        <div class="form-error" id="registerEmailError"></div>
      </div>

      <div class="form-group">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" placeholder="At least 6 characters" required>
        <div class="form-error" id="registerPasswordError"></div>
      </div>

      <div class="form-group">
        <label for="registerConfirmPassword">Confirm Password</label>
        <input type="password" id="registerConfirmPassword" placeholder="Confirm your password" required>
        <div class="form-error" id="registerConfirmPasswordError"></div>
      </div>

      <button class="btn btn-primary" onclick="handleRegister()">Create Account</button>

      <div class="auth-toggle">
        Already have an account? <a onclick="toggleForm()">Sign In</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/v1';

    function toggleForm() {
      document.getElementById('loginForm').classList.toggle('hidden');
      document.getElementById('registerForm').classList.toggle('hidden');
      clearAllErrors();
    }

    function clearAllErrors() {
      document.querySelectorAll('.form-error').forEach(el => {
        el.textContent = '';
        el.classList.remove('show');
      });
    }

    function showError(elementId, message) {
      const errorEl = document.getElementById(elementId);
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    function showSuccess(elementId, message) {
      const successEl = document.getElementById(elementId);
      successEl.textContent = message;
      successEl.classList.add('show');
    }

    async function handleLogin() {
      clearAllErrors();
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email) {
        showError('loginEmailError', 'Email is required');
        return;
      }

      if (!password) {
        showError('loginPasswordError', 'Password is required');
        return;
      }

      try {
        const btn = event.target;
        btn.classList.add('loading');

        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showError('loginEmailError', data.error || 'Login failed');
          btn.classList.remove('loading');
          return;
        }

        // Save token and redirect
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showSuccess('loginSuccess', 'Login successful! Redirecting...');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } catch (error) {
        showError('loginEmailError', 'Network error: ' + error.message);
        if (event.target) event.target.classList.remove('loading');
      }
    }

    async function handleRegister() {
      clearAllErrors();
      
      const username = document.getElementById('registerUsername').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;
      const confirmPassword = document.getElementById('registerConfirmPassword').value;

      let hasError = false;

      if (!username) {
        showError('registerUsernameError', 'Username is required');
        hasError = true;
      }

      if (!email) {
        showError('registerEmailError', 'Email is required');
        hasError = true;
      }

      if (!password) {
        showError('registerPasswordError', 'Password is required');
        hasError = true;
      } else if (password.length < 6) {
        showError('registerPasswordError', 'Password must be at least 6 characters');
        hasError = true;
      }

      if (password !== confirmPassword) {
        showError('registerConfirmPasswordError', 'Passwords do not match');
        hasError = true;
      }

      if (hasError) return;

      try {
        const btn = event.target;
        btn.classList.add('loading');

        const response = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password, confirmPassword })
        });

        const data = await response.json();

        if (!response.ok) {
          const errorField = data.error.toLowerCase().includes('email') ? 'registerEmailError' : 'registerUsernameError';
          showError(errorField, data.error || 'Registration failed');
          btn.classList.remove('loading');
          return;
        }

        // Save token and redirect
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showSuccess('registerSuccess', 'Account created! Redirecting...');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } catch (error) {
        showError('registerUsernameError', 'Network error: ' + error.message);
        if (event.target) event.target.classList.remove('loading');
      }
    }

    // Allow Enter key to submit
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const loginForm = document.getElementById('loginForm');
        if (!loginForm.classList.contains('hidden')) {
          handleLogin();
        } else {
          handleRegister();
        }
      }
    });

    // Check if already logged in
    window.addEventListener('load', () => {
      const token = localStorage.getItem('token');
      if (token) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
